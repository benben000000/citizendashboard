<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#ffffff; font-family:'Times New Roman', Times, Georgia, serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title / Label -->
  <text x="480" y="30" text-anchor="middle" fill="#000000" font-size="14" font-weight="bold" letter-spacing="0.5">Fig. 1. End-to-end data flow and continuous-time inference pipeline.</text>

  <!-- 1. Raw Telemetry Ingestion (Left Box) -->
  <g transform="translate(40, 60)">
    <rect width="200" height="380" rx="2" fill="#fafafa" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="32" x2="200" y2="32" stroke="#000000" stroke-width="1"/>
    <text x="100" y="21" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">1. BOUNDARY TELEMETRY</text>

    <!-- Sub-box A -->
    <g transform="translate(15, 48)">
      <rect width="170" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="12" y="20" fill="#000000" font-size="10.5" font-weight="bold">Kloudtech AWS IoT</text>
      <text x="12" y="38" fill="#333333" font-size="9.5">23 Physical Stations</text>
      <text x="12" y="54" fill="#555555" font-size="8.5">mTLS Sub-Second MQTT</text>
    </g>

    <!-- Sub-box B -->
    <g transform="translate(15, 130)">
      <rect width="170" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="12" y="20" fill="#000000" font-size="10.5" font-weight="bold">JMA Himawari-9</text>
      <text x="12" y="38" fill="#333333" font-size="9.5">Geostationary Satellite</text>
      <text x="12" y="54" fill="#555555" font-size="8.5">IR Convective Cloud Index</text>
    </g>

    <!-- Sub-box C -->
    <g transform="translate(15, 212)">
      <rect width="170" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="12" y="20" fill="#000000" font-size="10.5" font-weight="bold">Doppler Radar</text>
      <text x="12" y="38" fill="#333333" font-size="9.5">Column Reflectivity</text>
      <text x="12" y="54" fill="#555555" font-size="8.5">dBZ Composite Grid</text>
    </g>

    <!-- Ephemeral Notice -->
    <rect x="15" y="300" width="170" height="60" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="100" y="322" text-anchor="middle" fill="#000000" font-size="9" font-weight="bold">Ephemeral Ingestion</text>
    <text x="100" y="340" text-anchor="middle" fill="#444444" font-size="8">Volatile memory buffer only;</text>
    <text x="100" y="352" text-anchor="middle" fill="#444444" font-size="8">zero raw redistribution.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="240" x2="275" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 2. Feature Standardization & Physics (Middle Left) -->
  <g transform="translate(280, 60)">
    <rect width="180" height="380" rx="2" fill="#fafafa" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="32" x2="180" y2="32" stroke="#000000" stroke-width="1"/>
    <text x="90" y="21" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">2. PHYSICS CONSTRAINTS</text>

    <g transform="translate(12, 48)">
      <rect width="156" height="52" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="20" fill="#000000" font-size="10" font-weight="bold">Input Normalization</text>
      <text x="10" y="36" fill="#333333" font-size="9">x(t) = [T, HI, W, P]^T</text>
    </g>

    <g transform="translate(12, 112)">
      <rect width="156" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="10" font-weight="bold">Magnus-Tetens Sat.</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">es(T) = 6.1121 exp(...)</text>
      <text x="10" y="48" fill="#333333" font-size="8.5">Dew point Td calculation</text>
      <text x="10" y="62" fill="#555555" font-size="8.5">LCL depth: z_LCL ≈ 125 ΔTd</text>
    </g>

    <g transform="translate(12, 194)">
      <rect width="156" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="10" font-weight="bold">Solar Diurnal Cycle</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">Φ(t) = 2π(t - 14)/24</text>
      <text x="10" y="48" fill="#333333" font-size="8.5">Harmonic ΔT adjustment</text>
      <text x="10" y="62" fill="#555555" font-size="8.5">Hypsometric lapse rate</text>
    </g>

    <g transform="translate(12, 276)">
      <rect width="156" height="84" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="10" font-weight="bold">Catchment Hydrodynamics</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">d(WL)/dt = Qin - Qout</text>
      <text x="10" y="48" fill="#333333" font-size="8.5">- (0.15/τ_hydro)(WL - WLbase)</text>
      <text x="10" y="62" fill="#555555" font-size="8.5">Stage rating continuity</text>
      <text x="10" y="76" fill="#555555" font-size="8.5">23 station profiles</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="460" y1="240" x2="495" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3. Garcia PINN-LNN Engine (Middle Right) -->
  <g transform="translate(500, 60)">
    <rect width="210" height="380" rx="2" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="210" y2="32" stroke="#000000" stroke-width="1"/>
    <text x="105" y="21" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">3. GARCIA PINN-LNN</text>

    <g transform="translate(15, 48)">
      <rect width="180" height="80" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1"/>
      <text x="12" y="20" fill="#000000" font-size="10" font-weight="bold">Continuous-Time ODE Cell</text>
      <text x="12" y="36" fill="#000000" font-size="8.5" font-family="monospace">h(t+Δt) = e^(-Δt/τ) ⊙ h(t)</text>
      <text x="12" y="50" fill="#000000" font-size="8.5" font-family="monospace">+ (1 - e^(-Δt/τ)) ⊙ tanh(...)</text>
      <text x="12" y="68" fill="#444444" font-size="8">Inference: 53.99 - 74.94 μs</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="180" height="74" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="12" y="18" fill="#000000" font-size="10" font-weight="bold">Multi-Modal Rain Fusion</text>
      <text x="12" y="34" fill="#333333" font-size="8.5">P(Rain) = 0.35 P_LNN</text>
      <text x="12" y="48" fill="#333333" font-size="8.5">+ 0.45 P_Synoptic</text>
      <text x="12" y="62" fill="#333333" font-size="8.5">+ 0.20 (dBZ / 60)</text>
    </g>

    <g transform="translate(15, 226)">
      <rect width="180" height="64" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="12" y="18" fill="#000000" font-size="10" font-weight="bold">Convective Burst Detector</text>
      <text x="12" y="34" fill="#333333" font-size="8.5">Micro-burst intensity (mm/hr)</text>
      <text x="12" y="48" fill="#333333" font-size="8.5">Onset window identification</text>
    </g>

    <!-- Proprietary Derivative Block -->
    <g transform="translate(15, 302)">
      <rect width="180" height="58" rx="2" fill="#f0f0f0" stroke="#000000" stroke-width="1"/>
      <text x="90" y="24" text-anchor="middle" fill="#000000" font-size="9.5" font-weight="bold">PROPRIETARY DERIVATIVE</text>
      <text x="90" y="42" text-anchor="middle" fill="#333333" font-size="8.5">100% Commercial Independence</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="710" y1="240" x2="745" y2="240" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 4. Outputs (Right Box) -->
  <g transform="translate(750, 60)">
    <rect width="170" height="380" rx="2" fill="#fafafa" stroke="#000000" stroke-width="1.2"/>
    <line x1="0" y1="32" x2="170" y2="32" stroke="#000000" stroke-width="1"/>
    <text x="85" y="21" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">4. OUTPUT PRODUCTS</text>

    <g transform="translate(12, 48)">
      <rect width="146" height="66" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="9.5" font-weight="bold">Continuous Horizons</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">1h, 3h, 6h, 12h, 24h, 72h</text>
      <text x="10" y="50" fill="#555555" font-size="8">Analytical state trajectory</text>
    </g>

    <g transform="translate(12, 124)">
      <rect width="146" height="66" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="9.5" font-weight="bold">Flood Crest Forecasting</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">Peak stage magnitude (m)</text>
      <text x="10" y="50" fill="#555555" font-size="8">Lead time to peak crest</text>
    </g>

    <g transform="translate(12, 200)">
      <rect width="146" height="66" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="9.5" font-weight="bold">Rain Burst Nowcast</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">Onset window &amp; duration</text>
      <text x="10" y="50" fill="#555555" font-size="8">Downpour rate alerts</text>
    </g>

    <g transform="translate(12, 276)">
      <rect width="146" height="84" rx="2" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
      <text x="10" y="18" fill="#000000" font-size="9.5" font-weight="bold">Citizen Edge Interface</text>
      <text x="10" y="34" fill="#333333" font-size="8.5">Nearest GPS geolocation</text>
      <text x="10" y="50" fill="#333333" font-size="8.5">Multi-language (EN/FIL)</text>
      <text x="10" y="66" fill="#555555" font-size="8">Edge REST &amp; WebSocket API</text>
    </g>
  </g>
</svg>
