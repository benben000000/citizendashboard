<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%" style="background:#ffffff; font-family:'Times New Roman', Times, Georgia, serif;">
  <!-- Title / Label -->
  <text x="460" y="28" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold">Fig. 3. Multi-agent PINN-LNN tournament comparison (Composite Score vs. Latency).</text>

  <!-- Axes & Grid -->
  <g transform="translate(80, 50)">
    <!-- Y-Axis and X-Axis lines -->
    <line x1="60" y1="280" x2="740" y2="280" stroke="#000000" stroke-width="1.2"/>
    <line x1="60" y1="40" x2="60" y2="280" stroke="#000000" stroke-width="1.2"/>

    <!-- Grid Lines -->
    <line x1="60" y1="220" x2="740" y2="220" stroke="#dddddd" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="60" y1="160" x2="740" y2="160" stroke="#dddddd" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="60" y1="100" x2="740" y2="100" stroke="#dddddd" stroke-width="0.8" stroke-dasharray="3 3"/>
    <line x1="60" y1="40" x2="740" y2="40" stroke="#dddddd" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Y-Axis Labels (Composite Score) -->
    <text x="50" y="284" text-anchor="end" fill="#000000" font-size="10">56.0</text>
    <text x="50" y="224" text-anchor="end" fill="#000000" font-size="10">58.0</text>
    <text x="50" y="164" text-anchor="end" fill="#000000" font-size="10">60.0</text>
    <text x="50" y="104" text-anchor="end" fill="#000000" font-size="10">62.0</text>
    <text x="50" y="44" text-anchor="end" fill="#000000" font-size="10">64.0</text>
    <text x="45" y="22" text-anchor="end" fill="#000000" font-size="10" font-weight="bold">Score (pts)</text>

    <!-- Bar 1: Energy Conserving Gen-2 (Champion) -->
    <g transform="translate(100, 0)">
      <rect x="0" y="34" width="75" height="246" fill="#111111" stroke="#000000" stroke-width="1"/>
      <text x="37.5" y="24" text-anchor="middle" fill="#000000" font-size="10.5" font-weight="bold">64.20 pts</text>
      <text x="37.5" y="60" text-anchor="middle" fill="#ffffff" font-size="8.5" font-weight="bold">53.99 μs</text>
      <text x="37.5" y="80" text-anchor="middle" fill="#ffffff" font-size="8">MAE: 0.3°C</text>
      <text x="37.5" y="98" text-anchor="middle" fill="#ffffff" font-size="8">WL: 18.2cm</text>
      <text x="37.5" y="300" text-anchor="middle" fill="#000000" font-size="9.5" font-weight="bold">Gen-2 Evolved</text>
      <text x="37.5" y="314" text-anchor="middle" fill="#444444" font-size="8.5">(Best / Champion)</text>
    </g>

    <!-- Bar 2: Energy Conserving Gen-1 -->
    <g transform="translate(220, 0)">
      <rect x="0" y="70" width="75" height="210" fill="#555555" stroke="#000000" stroke-width="1"/>
      <text x="37.5" y="60" text-anchor="middle" fill="#000000" font-size="10" font-weight="bold">63.00 pts</text>
      <text x="37.5" y="95" text-anchor="middle" fill="#ffffff" font-size="8.5">74.94 μs</text>
      <text x="37.5" y="112" text-anchor="middle" fill="#ffffff" font-size="8">MAE: 0.3°C</text>
      <text x="37.5" y="128" text-anchor="middle" fill="#ffffff" font-size="8">WL: 17.1cm</text>
      <text x="37.5" y="300" text-anchor="middle" fill="#000000" font-size="9.5">Energy Conserving</text>
      <text x="37.5" y="314" text-anchor="middle" fill="#444444" font-size="8.5">(Gen-1 Base)</text>
    </g>

    <!-- Bar 3: Adaptive Bayesian -->
    <g transform="translate(340, 0)">
      <rect x="0" y="72" width="75" height="208" fill="#777777" stroke="#000000" stroke-width="1"/>
      <text x="37.5" y="62" text-anchor="middle" fill="#000000" font-size="10" font-weight="bold">62.94 pts</text>
      <text x="37.5" y="95" text-anchor="middle" fill="#ffffff" font-size="8.5">66.77 μs</text>
      <text x="37.5" y="112" text-anchor="middle" fill="#ffffff" font-size="8">MAE: 0.3°C</text>
      <text x="37.5" y="128" text-anchor="middle" fill="#ffffff" font-size="8">WL: 18.6cm</text>
      <text x="37.5" y="300" text-anchor="middle" fill="#000000" font-size="9.5">Adaptive Bayesian</text>
      <text x="37.5" y="314" text-anchor="middle" fill="#444444" font-size="8.5">(Monte Carlo)</text>
    </g>

    <!-- Bar 4: Canonical CfC-LNN -->
    <g transform="translate(460, 0)">
      <rect x="0" y="124" width="75" height="156" fill="#999999" stroke="#000000" stroke-width="1"/>
      <text x="37.5" y="114" text-anchor="middle" fill="#000000" font-size="10" font-weight="bold">61.18 pts</text>
      <text x="37.5" y="148" text-anchor="middle" fill="#ffffff" font-size="8.5">94.39 μs</text>
      <text x="37.5" y="165" text-anchor="middle" fill="#ffffff" font-size="8">MAE: 0.3°C</text>
      <text x="37.5" y="180" text-anchor="middle" fill="#ffffff" font-size="8">WL: 17.5cm</text>
      <text x="37.5" y="300" text-anchor="middle" fill="#000000" font-size="9.5">Canonical CfC</text>
      <text x="37.5" y="314" text-anchor="middle" fill="#444444" font-size="8.5">(Pure Neural ODE)</text>
    </g>

    <!-- Bar 5: Multi-Scale LNN -->
    <g transform="translate(580, 0)">
      <rect x="0" y="142" width="75" height="138" fill="#bbbbbb" stroke="#000000" stroke-width="1"/>
      <text x="37.5" y="132" text-anchor="middle" fill="#000000" font-size="10" font-weight="bold">60.58 pts</text>
      <text x="37.5" y="165" text-anchor="middle" fill="#000000" font-size="8.5">79.38 μs</text>
      <text x="37.5" y="180" text-anchor="middle" fill="#000000" font-size="8">MAE: 0.3°C</text>
      <text x="37.5" y="195" text-anchor="middle" fill="#000000" font-size="8">WL: 21.2cm</text>
      <text x="37.5" y="300" text-anchor="middle" fill="#000000" font-size="9.5">Multi-Scale</text>
      <text x="37.5" y="314" text-anchor="middle" fill="#444444" font-size="8.5">(Tri-Scale Tau)</text>
    </g>
  </g>
</svg>
