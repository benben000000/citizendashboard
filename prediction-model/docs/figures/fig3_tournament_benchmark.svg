<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%" style="background:#ffffff; font-family:'Newsreader', 'Times New Roman', Times, Georgia, serif;">
  <!-- Axes & Grid -->
  <g transform="translate(60, 30)">
    <!-- Y-Axis and X-Axis lines -->
    <line x1="70" y1="260" x2="820" y2="260" stroke="#000000" stroke-width="1.5"/>
    <line x1="70" y1="30" x2="70" y2="260" stroke="#000000" stroke-width="1.5"/>

    <!-- Grid Lines -->
    <line x1="70" y1="210" x2="820" y2="210" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="70" y1="150" x2="820" y2="150" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="70" y1="90" x2="820" y2="90" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="70" y1="30" x2="820" y2="30" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- Y-Axis Labels (Composite Score) -->
    <text x="58" y="264" text-anchor="end" fill="#000000" font-size="11">56.0</text>
    <text x="58" y="214" text-anchor="end" fill="#000000" font-size="11">58.0</text>
    <text x="58" y="154" text-anchor="end" fill="#000000" font-size="11">60.0</text>
    <text x="58" y="94" text-anchor="end" fill="#000000" font-size="11">62.0</text>
    <text x="58" y="34" text-anchor="end" fill="#000000" font-size="11">64.0</text>
    <text x="55" y="14" text-anchor="end" fill="#000000" font-size="11.5" font-weight="bold">Score (pts)</text>

    <!-- Bar 1: Energy Conserving Gen-2 (Champion) -->
    <g transform="translate(100, 0)">
      <rect x="0" y="24" width="95" height="236" fill="#111111" stroke="#000000" stroke-width="1.2"/>
      <text x="47.5" y="15" text-anchor="middle" fill="#000000" font-size="12" font-weight="bold">64.20 pts</text>
      <text x="47.5" y="52" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="bold">53.99 μs</text>
      <text x="47.5" y="72" text-anchor="middle" fill="#ffffff" font-size="9.5">MAE: 0.30°C</text>
      <text x="47.5" y="90" text-anchor="middle" fill="#ffffff" font-size="9.5">WL: 18.2 cm</text>
      <text x="47.5" y="280" text-anchor="middle" fill="#000000" font-size="11" font-weight="bold">Gen-2 Evolved</text>
      <text x="47.5" y="296" text-anchor="middle" fill="#444444" font-size="9.5">(Champion PINN-LNN)</text>
    </g>

    <!-- Bar 2: Energy Conserving Gen-1 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="55" width="95" height="205" fill="#555555" stroke="#000000" stroke-width="1.2"/>
      <text x="47.5" y="45" text-anchor="middle" fill="#000000" font-size="11.5" font-weight="bold">63.00 pts</text>
      <text x="47.5" y="80" text-anchor="middle" fill="#ffffff" font-size="10">74.94 μs</text>
      <text x="47.5" y="98" text-anchor="middle" fill="#ffffff" font-size="9.5">MAE: 0.30°C</text>
      <text x="47.5" y="116" text-anchor="middle" fill="#ffffff" font-size="9.5">WL: 17.1 cm</text>
      <text x="47.5" y="280" text-anchor="middle" fill="#000000" font-size="11">Energy Conserving</text>
      <text x="47.5" y="296" text-anchor="middle" fill="#444444" font-size="9.5">(Gen-1 Baseline)</text>
    </g>

    <!-- Bar 3: Adaptive Bayesian -->
    <g transform="translate(380, 0)">
      <rect x="0" y="58" width="95" height="202" fill="#777777" stroke="#000000" stroke-width="1.2"/>
      <text x="47.5" y="48" text-anchor="middle" fill="#000000" font-size="11.5" font-weight="bold">62.94 pts</text>
      <text x="47.5" y="82" text-anchor="middle" fill="#ffffff" font-size="10">66.77 μs</text>
      <text x="47.5" y="100" text-anchor="middle" fill="#ffffff" font-size="9.5">MAE: 0.30°C</text>
      <text x="47.5" y="118" text-anchor="middle" fill="#ffffff" font-size="9.5">WL: 18.6 cm</text>
      <text x="47.5" y="280" text-anchor="middle" fill="#000000" font-size="11">Adaptive Bayesian</text>
      <text x="47.5" y="296" text-anchor="middle" fill="#444444" font-size="9.5">(Monte Carlo Drop)</text>
    </g>

    <!-- Bar 4: Canonical CfC-LNN -->
    <g transform="translate(520, 0)">
      <rect x="0" y="104" width="95" height="156" fill="#999999" stroke="#000000" stroke-width="1.2"/>
      <text x="47.5" y="94" text-anchor="middle" fill="#000000" font-size="11.5" font-weight="bold">61.18 pts</text>
      <text x="47.5" y="128" text-anchor="middle" fill="#ffffff" font-size="10">94.39 μs</text>
      <text x="47.5" y="146" text-anchor="middle" fill="#ffffff" font-size="9.5">MAE: 0.30°C</text>
      <text x="47.5" y="164" text-anchor="middle" fill="#ffffff" font-size="9.5">WL: 20.4 cm</text>
      <text x="47.5" y="280" text-anchor="middle" fill="#000000" font-size="11">Canonical CfC-LNN</text>
      <text x="47.5" y="296" text-anchor="middle" fill="#444444" font-size="9.5">(Hasani et al. 2022)</text>
    </g>

    <!-- Bar 5: Discrete LSTM Baseline -->
    <g transform="translate(660, 0)">
      <rect x="0" y="180" width="95" height="80" fill="#cccccc" stroke="#000000" stroke-width="1.2"/>
      <text x="47.5" y="170" text-anchor="middle" fill="#000000" font-size="11.5" font-weight="bold">42.10 pts</text>
      <text x="47.5" y="200" text-anchor="middle" fill="#000000" font-size="9.5">4,820 μs</text>
      <text x="47.5" y="216" text-anchor="middle" fill="#000000" font-size="9">MAE: 1.84°C</text>
      <text x="47.5" y="232" text-anchor="middle" fill="#000000" font-size="9">WL: 44.5 cm</text>
      <text x="47.5" y="280" text-anchor="middle" fill="#000000" font-size="11">Discrete LSTM</text>
      <text x="47.5" y="296" text-anchor="middle" fill="#444444" font-size="9.5">(Step-Discretized)</text>
    </g>
  </g>
</svg>
