<!doctype html><html><head><meta charset='utf-8'><title>prediction model logs LIVE</title><style>body{font-family:ui-monospace,Consolas,monospace;font-size:12px;margin:12px;background:#fff;color:#000}h1{font-size:17px;margin:0 0 4px}.meta{font-size:12px;margin-bottom:6px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:2px 6px;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#e8e8e8;font-size:11px}tr:nth-child(even){background:#f7f7f7}tr.hot{background:#fff3a0}.wrap{max-height:84vh;overflow:auto;border:1px solid #999}button{font:inherit;padding:4px 10px;margin-right:6px}</style></head><body><h1>prediction model &mdash; LIVE LOGS</h1><div class='meta'><button onclick='full()'>load FULL history</button><button onclick='poll()'>refresh</button><span id='mode'>mode: current (live cache)</span> | poll <b id='n'>0</b> | stations <b id='st'>-</b> | rows <b id='rc'>-</b> | cache age <b id='age'>-</b> | changed <span id='live'>0</span> | every 3s</div><div class='wrap'><table><thead><tr><th>recorded UTC</th><th>station</th><th>hz</th><th>temp C</th><th>heat idx C</th><th>humid %</th><th>press hPa</th><th>press tend</th><th>wind km/h</th><th>wind deg</th><th>rain %</th><th>precip mm</th><th>temp prod</th><th>hum prod</th><th>press prod</th><th>wind prod</th><th>trusted</th><th>valid at UTC</th></tr></thead><tbody id='tb'></tbody></table></div><script>var COLS=['ts','sid','hz','t','hi','hu','pr','pt','ws','wd','cr','pm','pt_prod','hu_prod','pr_prod','ws_prod','tr','tgt'];var seen={},polls=0,mode='current';function esc(v){if(v===null||v===undefined||v==='')return '';return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;');}function fmt(v){if(v===null||v===undefined)return '';var s=String(v);return s.indexOf('T')>0?s.replace('T',' ').slice(0,19):s;}function render(rows){  var changed=0,hot={},i,j,o,k,sig;  for(i=0;i<rows.length;i++){    o=rows[i];k=o.sid+'|'+o.hz;    sig=JSON.stringify([o.ts,o.t,o.hi,o.hu,o.pr,o.ws,o.cr,o.tr]);    if(seen[k]!==undefined&&seen[k]!==sig){changed++;hot[k]=1;}    seen[k]=sig;  }  rows.sort(function(a,b){return String(b.ts).localeCompare(String(a.ts));});  var h='';  for(i=0;i<rows.length&&i<6000;i++){    o=rows[i];    h+='<tr'+(hot[o.sid+'|'+o.hz]?' class="hot"':'')+'>';    for(j=0;j<COLS.length;j++)h+='<td>'+esc(fmt(o[COLS[j]]))+'</td>';    h+='</tr>';  }  document.getElementById('tb').innerHTML=h;  document.getElementById('rc').textContent=rows.length;  document.getElementById('live').textContent=changed;  document.getElementById('live').style.color=changed>0?'#0a0':'#000';}function flat(hist){  var out=[],i,h,f,v,src;  for(i=0;i<hist.length;i++){    h=hist[i];f=h.forecast_raw||{};v=h.variables||{};    src=function(k){return (v[k]&&v[k].producer)||null;};    out.push({ts:h.recorded_at_utc,sid:h.station_id,hz:h.horizon_hours,      t:f.temperature_c,hi:f.heat_index_c,hu:f.relative_humidity_pct,      pr:f.pressure_hpa,pt:f.pressure_tendency,ws:f.wind_speed_kmh,wd:f.wind_direction_deg,      cr:f.chance_of_rain_pct,pm:f.expected_precipitation_mm,      pt_prod:src('temperature'),hu_prod:src('humidity'),      pr_prod:src('pressure'),ws_prod:src('wind_speed'),      tr:(f.input_quality_gate||{}).learned_output_trusted,tgt:f.target_timestamp});  }  return out;}function currentRows(d){  var st=(d||{}).stations||{},rows=[],ids=Object.keys(st),i,j,sid,hz,s,pr,f,src;  for(i=0;i<ids.length;i++){    sid=ids[i];s=st[sid];pr=s.operational_predictions||{};    var hs=Object.keys(pr).sort();    for(j=0;j<hs.length;j++){      hz=hs[j];f=(pr[hz]&&pr[hz].forecast)||{};src=f.selected_source_by_variable||{};      rows.push({ts:s.timestamp,sid:sid,hz:hz,t:f.temperature_c,hi:f.heat_index_c,        hu:f.relative_humidity_pct,pr:f.pressure_hpa,pt:f.pressure_tendency,        ws:f.wind_speed_kmh,wd:f.wind_direction_deg,cr:f.chance_of_rain_pct,        pm:f.expected_precipitation_mm,pt_prod:src.temperature,hu_prod:src.humidity,        pr_prod:src.pressure,ws_prod:src.wind_speed,        tr:(f.input_quality_gate||{}).learned_output_trusted,tgt:f.target_timestamp});    }  }  return rows;}function poll(){  polls++;document.getElementById('n').textContent=polls;  if(mode==='full'){    fetch('/api/prediction/mqtt/live',{cache:'no-store'}).then(function(r){return r.json();})    .then(function(j){      var ids=Object.keys(((j||{}).data||{}).stations||{});      document.getElementById('st').textContent=ids.length;      return Promise.all(ids.map(function(s){        return fetch('/api/prediction/provenance?station='+encodeURIComponent(s),{cache:'no-store'})        .then(function(r){return r.json();})        .then(function(p){return flat(((p||{}).data||{}).forecastHistory||[]);});      }));    }).then(function(ch){var all=[],i;for(i=0;i<ch.length;i++)all=all.concat(ch[i]);render(all);})    .catch(function(e){document.getElementById('mode').textContent='error '+e;});    return;  }  fetch('/api/prediction/mqtt/live',{cache:'no-store'}).then(function(r){return r.json();})  .then(function(j){    var d=(j||{}).data||{};    document.getElementById('st').textContent=d.total_active_stations!==undefined?d.total_active_stations:'-';    var a='-';    if(d.last_updated){var t=Date.parse(d.last_updated);if(!isNaN(t))a=((Date.now()-t)/1000).toFixed(0)+'s';}    document.getElementById('age').textContent=a;    render(currentRows(d.stations));  }).catch(function(e){document.getElementById('age').textContent='fetch failed '+e;});}function full(){  mode='full';  document.getElementById('mode').textContent='mode: FULL history (audit trail)';  poll();}poll();setInterval(poll,3000);</script></body></html>
